<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="index.css">
    <title>Tic Tac Toe</title>
</head>
<body>
    <div id="players_div">
        <input type="text" placeholder="Player 1" id="player1_name">
        <button id="ng_btn">New Game</button>
        <input type="text" placeholder="Player 2" id="player2_name">
    </div>
    <div id="game_div">
        <p id="score_p1">0</p>
        <div id="game_board">
            <div data-id="00"></div>
            <div data-id="01"></div>
            <div data-id="02"></div>
            <div data-id="10"></div>
            <div data-id="11"></div>
            <div data-id="12"></div>
            <div data-id="20"></div>
            <div data-id="21"></div>
            <div data-id="22"></div>
        </div>
        <p id="score_p2">0</p>
    </div>
</body>
</html>
